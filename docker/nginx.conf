# Site config for the Docker image (replaces nginx's default.conf).
# Mirrors GitHub Pages: missing URLs get 404.html with a 404 status.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Not "internal": sw.js precaches 404.html, so a direct request must return 200.
    location = /404.html {
    }

    # The service worker must be re-checked on every visit so updates reach visitors.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }
}
